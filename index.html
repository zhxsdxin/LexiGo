<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="LexiGo — 极简日语单词学习网站">
  <meta name="theme-color" content="#f7f6f2">
  <title>LexiGo · 日语单词速学</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
  <div class="app">
    <!-- 顶栏：项目名 / 词库 / 极简进度 -->
    <header class="topbar">
      <div class="topbar__brand">
        <span class="topbar__name">LexiGo</span>
        <span class="topbar__deck" data-deck-name>默认词库</span>
      </div>
      <div class="topbar__meta">
        <span class="topbar__meta" data-el="top-due" hidden></span>
        <div class="topprogress" role="progressbar" aria-label="词库学习进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="topprogress__fill" data-el="top-fill" style="width:0%"></div>
        </div>
        <span data-el="top-text">0 / 5</span>
      </div>
    </header>

    <!-- 三个标签 -->
    <nav class="tabs" role="tablist" aria-label="主导航">
      <button type="button" class="tabs__btn" role="tab" data-tab="study" aria-selected="true" aria-controls="view-study" id="tab-study">
        学习<span class="tabs__badge" data-badge="study" hidden></span>
      </button>
      <button type="button" class="tabs__btn" role="tab" data-tab="review" aria-selected="false" aria-controls="view-review" id="tab-review">
        复习<span class="tabs__badge" data-badge="review" hidden></span>
      </button>
      <button type="button" class="tabs__btn" role="tab" data-tab="progress" aria-selected="false" aria-controls="view-progress" id="tab-progress">
        进度
      </button>
    </nav>

    <main class="main">
      <!-- A. 单词学习 -->
      <section class="view view--cards is-active" id="view-study" role="tabpanel" aria-labelledby="tab-study">
        <div class="card" data-el="card"></div>
        <div class="actions" data-el="actions"></div>
        <div class="navbar">
          <div class="navbar__side">
            <button type="button" class="navbtn" data-el="prev" aria-label="上一个单词">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
              上一词
            </button>
            <button type="button" class="navbtn" data-el="next" aria-label="下一个单词">
              下一词
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
            </button>
            <div class="picker" data-el="picker">
              <button type="button" class="picker__toggle" aria-label="选择单词">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 9l4-4 4 4"/><path d="M16 15l-4 4-4-4"/></svg>
                <span data-el="counter" class="navbar__counter"></span>
              </button>
              <ul class="picker__list" data-el="picker-list"></ul>
            </div>
          </div>
          <div class="navbar__side">
            <button type="button" class="navbtn navbtn--icon" data-el="shuffle" aria-pressed="false" aria-label="切换随机顺序" title="切换随机顺序">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
            </button>
          </div>
        </div>
        <p class="footnote">
          <kbd>空格</kbd> 翻转卡片 · <kbd>←</kbd><kbd>→</kbd> 切换 · <kbd>R</kbd> 发音
        </p>
      </section>

      <!-- B. 速成复习 -->
      <section class="view view--cards" id="view-review" role="tabpanel" aria-labelledby="tab-review">
        <div data-el="state" hidden></div>
        <div class="card" data-el="card"></div>
        <div class="actions" data-el="actions"></div>
        <div class="navbar">
          <div class="picker" data-el="picker">
            <button type="button" class="picker__toggle" aria-label="选择待复习单词">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 9l4-4 4 4"/><path d="M16 15l-4 4-4-4"/></svg>
              <span data-el="status"></span>
            </button>
            <ul class="picker__list" data-el="picker-list"></ul>
          </div>
          <div class="navbar__side">
            <button type="button" class="navbtn" data-el="restart">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
              重新开始
            </button>
          </div>
        </div>
        <p class="footnote">
          答对的词复习间隔会自动拉长，答错的词本轮内会再考一次。
        </p>
      </section>

      <!-- C. 学习进度 -->
      <section class="view" id="view-progress" role="tabpanel" aria-labelledby="tab-progress">
        <div class="panel" data-el="panel"></div>
        <p class="footnote">数据保存在此浏览器本地，不会上传。</p>
      </section>
    </main>
  </div>

  <script src="assets/js/data/wordbank.js"></script>
  <script src="assets/js/core/store.js"></script>
  <script src="assets/js/core/srs.js"></script>
  <script src="assets/js/core/stats.js"></script>
  <script src="assets/js/core/speech.js"></script>
  <script src="assets/js/ui/card.js"></script>
  <script src="assets/js/ui/picker.js"></script>
  <script src="assets/js/views/study.js"></script>
  <script src="assets/js/views/review.js"></script>
  <script src="assets/js/views/progress.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
